# ============================================================
#  gateway.properties ? Configurações do Gateway IoT
# ============================================================

# ?? Identidade ????????????????????????????????????????????????
gateway.id=gateway_01

# ?? CoAP (entrada ? drone) ????????????????????????????????????
coap.port=5683
coap.resource.drone=dados/drone

# ?? MQTT (entrada ? estação) ??????????????????????????????????
# Quando rodando em Docker: usar nome do serviço "mosquitto"
# Quando rodando local: usar "localhost"
mqtt.broker.host=mosquitto
mqtt.broker.port=1883
mqtt.broker.user=
mqtt.broker.password=
mqtt.connection.timeout=30
mqtt.keepalive=60

# Tópicos de subscrição
mqtt.topic.telemetry=ambiente/estacao/estacao_01/telemetria
mqtt.topic.status=ambiente/estacao/estacao_01/status

# ?? HTTP (saída ? datacenter) ?????????????????????????????????
datacenter.url=http://10.211.243.164:8000
datacenter.endpoint.ingest=/ingestao
datacenter.endpoint.metrics=/gateway/metrics
datacenter.connect.timeout.ms=5000
datacenter.read.timeout.ms=10000
datacenter.retry.max=3
datacenter.retry.backoff.ms=2000

# Tamanho máximo da fila de retry (dados aguardando reenvio)
datacenter.retry.queue.size=100

# ?? Pipeline ??????????????????????????????????????????????????
# Intervalo de publicação de métricas do gateway ao datacenter (ms)
pipeline.metrics.interval.ms=60000