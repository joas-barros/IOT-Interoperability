# ============================================================
#  mosquitto.conf — Broker MQTT do Gateway
#  Montado em: /mosquitto/config/mosquitto.conf
# ============================================================

listener 1883

# ── Porta TLS (clientes externos — estação RPi A) ─────────────────────────────
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key


# Não exige certificado do cliente (TLS simples, não mTLS)
require_certificate false

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all

max_keepalive 300
